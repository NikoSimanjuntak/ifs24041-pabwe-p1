<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form pendaftaran akun untuk mengisi data diri pengguna.">
    <title>Daftar Akun</title>
</head>

<body>

    <main>

        <h1>Daftar Akun</h1>

        <form>

            <fieldset>

                <legend>Daftar Akun</legend>

                <p>
                    <label for="nama_lengkap">Nama Lengkap:</label>
                    <input type="text"
                           id="nama_lengkap"
                           name="nama_lengkap">
                </p>

                <hr>

                <p>
                    <strong>Jenis Kelamin:</strong>
                    <br>

                    <input type="radio"
                           id="laki_laki"
                           name="jenis_kelamin"
                           value="laki-laki">

                    <label for="laki_laki">Laki-Laki</label>

                    <input type="radio"
                           id="perempuan"
                           name="jenis_kelamin"
                           value="perempuan">

                    <label for="perempuan">Perempuan</label>
                </p>

                <hr>

                <p>
                    <label for="tempat_lahir">Tempat Lahir:</label>
                    <input type="text"
                           id="tempat_lahir"
                           name="tempat_lahir">
                </p>

                <hr>

                <p>
                    <label for="tanggal_lahir">Tanggal Lahir:</label>
                    <input type="date"
                           id="tanggal_lahir"
                           name="tanggal_lahir">
                </p>

                <hr>

                <p>
                    <label for="agama">Agama:</label>

                    <select id="agama" name="agama">
                        <option value="">--- Pilih Agama ---</option>
                        <option value="islam">Islam</option>
                        <option value="katolik">Katolik</option>
                        <option value="protestan">Protestan</option>
                        <option value="hindu">Hindu</option>
                        <option value="buddha">Buddha</option>
                        <option value="konghucu">Konghucu</option>
                    </select>
                </p>

                <hr>

                <p>
                    <strong>Hobi:</strong>
                    <br>

                    <input type="checkbox"
                           id="olahraga"
                           name="hobi"
                           value="olahraga">

                    <label for="olahraga">Olahraga</label>

                    <input type="checkbox"
                           id="membaca"
                           name="hobi"
                           value="membaca">

                    <label for="membaca">Membaca</label>

                    <input type="checkbox"
                           id="ngoding"
                           name="hobi"
                           value="ngoding">

                    <label for="ngoding">Ngoding</label>
                </p>

                <hr>

                <p>
                    <label for="password">Password:</label>
                    <input type="password"
                           id="password"
                           name="password">
                </p>

                <hr>

                <p>
                    <input type="checkbox"
                           id="persetujuan"
                           name="persetujuan">

                    <label for="persetujuan">
                        Dengan mendaftar saya setuju dengan Ketentuan
                        dan Kebijakan Privasi Aplikasi.
                    </label>
                </p>

                <p>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Submit">
                </p>

            </fieldset>

        </form>

    </main>

</body>

</html>
